pre-commit:
  parallel: false
  commands:
    gitleaks:
      run: gitleaks detect --source . --no-git --redact
    shellcheck:
      glob: "scripts/*.sh"
      run: shellcheck {staged_files}
    app-check:
      root: app
      glob: "app/**/*.{ts,json}"
      run: pnpm check
    app-format:
      root: app
      glob: "app/**/*.{ts,json}"
      run: pnpm check:format
