services:
  primary:
    command:
      - /bin/sqld
      - --admin-listen-addr
      - 0.0.0.0:8082
      - --enable-namespaces
      - --disable-default-namespace
      - --no-welcome

  replica:
    command:
      - /bin/sqld
      - --enable-namespaces
      - --disable-default-namespace
      - --no-welcome
