name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          install: true
      - run: pnpm --dir app install --frozen-lockfile
      - run: gitleaks detect --source . --no-git --redact
      - run: shellcheck scripts/*.sh
      - run: pnpm --dir app check
      - run: pnpm --dir app check:format

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          install: true
      - run: pnpm --dir app install --frozen-lockfile
      - run: ./scripts/smoke-test.sh
